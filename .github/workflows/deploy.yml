name: Publicar el joc a la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar pygbag
        run: python -m pip install pygbag

      - name: Comprovar que el joc arrenca (sense pantalla)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install pygame-ce
          python main.py --test

      - name: Construir el joc per a la web
        # --width/--height: la mida real del joc (si no, pygbag posa 1280x720)
        # --ume_block 0: al mobil, no cal tocar primer una pantalla d'espera
        run: >-
          python -m pygbag --build
          --width 1000 --height 600
          --ume_block 0 --can_close 0
          --app_name cavernicola --title "Cavernicola" .

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
